services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      API_PORT: 4000
      FRONTEND_URL: http://localhost:3001
      JWT_SECRET: replace-this-with-a-strong-32-character-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ChangeMe123!
      REDIS_URL: redis://redis:6379
      DATA_DIR: /app/data
    volumes:
      - mobs-data:/app/data
    depends_on:
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3001:3001"
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  mobs-data:
